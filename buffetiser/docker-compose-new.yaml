services:
  db:
    image: postgres:17
    container_name: buffetiser_db
    restart: always
    environment:
      POSTGRES_USER: buffetiser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: BUFFETISER_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buffetiser"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: buffetiser_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend_fastapi
    container_name: buffetiser_backend_fastapi
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend_fastapi:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_DB=BUFFETISER_DB
      - POSTGRES_USER=buffetiser
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379
      - DEBUG=True
    networks:
      - network

  frontend:
    build:
      context: ./frontend_ts
    container_name: buffetiser_frontend_ts
    depends_on:
      - backend
    volumes:
      - ./frontend_ts:/app
      - /app/node_modules
    networks:
      - network
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npm install && npm start"]
    environment:
      - REACT_APP_API_URL=http://localhost:8000

  webserver:
    image: nginx:alpine
    container_name: buffetiser_webserver
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend_ts/build:/usr/share/nginx/html:ro
    ports:
      - "81:80"
    networks:
      - network

networks:
  network:
    driver: bridge

volumes:
  postgres_data:
